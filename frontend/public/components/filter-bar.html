<!DOCTYPE html>
<div class="filter-bar">
    <label for="country">Pays :</label>
    <select id="country">
      <option value="all">Tous les pays</option>
      <option value="france">France</option>
      <option value="usa">États-Unis</option>
      <option value="japon">Japon</option>
      <option value="chine">Chine</option>
    </select>
  
    <label for="omsRegion">Région OMS :</label>
    <select id="omsRegion">
      <option value="all">Toutes les régions OMS</option>
      <option value="americas">Amériques</option>
      <option value="europe">Europe</option>
      <option value="western-pacific">Pacifique occidental</option>
      <option value="south-east-asia">Asie du Sud-Est</option>
      <option value="eastern-mediterranean">Méditerranéenne orientale</option>
      <option value="africa">Afrique</option>
    </select>
  
    <label for="date">Date :</label>
    <input type="date" id="date">
  </div>
